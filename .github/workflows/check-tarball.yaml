name: PAmeasures 2.0.0 macOS devel source-dependency check

on:
  push:
    branches: ['cran-check-2.0.0-*']

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        r: [devel]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: true
      _R_CHECK_FORCE_SUGGESTS_: true
      _R_CHECK_LIMIT_CORES_: true
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Verify and extract the exact source tarball
        shell: Rscript {0}
        run: |
          expected <- strsplit(readLines("SHA256SUMS"), "  ", fixed = TRUE)[[1L]][1L]
          actual <- as.character(tools::sha256sum("PAmeasures_2.0.0.tar.gz"))
          stopifnot(identical(unname(actual), expected))
          cat("Source SHA256:", actual, "\n")
          untar("PAmeasures_2.0.0.tar.gz")
      - name: Install gettext headers and library from the R macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          archive="$RUNNER_TEMP/gettext-0.22.5-arm64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            https://mac.r-project.org/bin/darwin20/arm64/gettext-0.22.5-darwin.20-arm64.tar.xz \
            -o "$archive"
          echo "c95b5f28eadfac4ce5b31a8359afa3671bfbd059e002f0279996500a5e9f6d40  $archive" | shasum -a 256 -c -
          sudo tar -xJf "$archive" -C /
          test -r /opt/R/arm64/include/libintl.h
          test -r /opt/R/arm64/lib/libintl.a
          ls -l /opt/R/arm64/include/libintl.h /opt/R/arm64/lib/libintl.a
      - name: Configure the Flang intrinsic module search path
        shell: bash
        run: |
          set -euo pipefail
          modules=/opt/R/flang-23/lib/clang/23/finclude/flang/arm64-apple-darwin22.6.0
          if [ ! -r "$modules/iso_fortran_env.mod" ]; then
            archive="$RUNNER_TEMP/flang-23.1.1.tar.xz"
            curl --fail --silent --show-error --location --retry 3 \
              https://github.com/R-macos/llvm-project/releases/download/23.1.1/flang-23.1.1-darwin22.6.0.tar.xz \
              -o "$archive"
            echo "d622136b9c0c2030986cc786edd673ae5a52acdd25e5123d12c9edca5f84016d  $archive" | shasum -a 256 -c -
            sudo tar -xJf "$archive" -C /
          fi
          test -r "$modules/iso_fortran_env.mod"
          Rscript configure-flang-modules.R
      - name: Record compiler configuration and probe C/Fortran compilation
        shell: Rscript {0}
        run: |
          writeLines(R.version.string, "dependency-R-version.txt")
          library <- file.path(Sys.getenv("RUNNER_TEMP"), "Library")
          dir.create(library, recursive = TRUE, showWarnings = FALSE)
          cat("R_LIBS_USER=", library, "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
          config <- unlist(lapply(c("CC", "CFLAGS", "CPPFLAGS", "LDFLAGS", "CXX17", "FC", "FFLAGS", "FCFLAGS", "FLIBS"), function(key) {
            c(key, system2(file.path(R.home("bin"), "R"), c("CMD", "config", key), stdout = TRUE))
          }))
          writeLines(config, "compiler-config.txt")
          writeLines(c("#include <libintl.h>", "void c_probe(double *x) { *x = 1.0; }"), "c-compiler-probe.c")
          writeLines(c("subroutine f_probe(x)", "use, intrinsic :: iso_fortran_env, only: real64", "real(real64) :: x", "x = 1.0_real64", "end subroutine"), "fortran-compiler-probe.f90")
          output <- system2(file.path(R.home("bin"), "R"),
            c("CMD", "SHLIB", "c-compiler-probe.c", "fortran-compiler-probe.f90"), stdout = TRUE, stderr = TRUE)
          writeLines(output, "compiler-probe.log")
          status <- attr(output, "status")
          if (!is.null(status) && status != 0L) {
            message <- paste(output, collapse = " | ")
            message <- gsub("%", "%25", message, fixed = TRUE)
            cat("::error title=C and Fortran preflight::", message, "\n", sep = "")
            stop("Compiler preflight failed; see compiler-probe.log")
          }
      - uses: actions/cache/restore@v5
        id: dependencies-cache
        with:
          path: ${{ env.R_LIBS_USER }}
          key: macos-devel-source-v3-${{ hashFiles('dependency-R-version.txt') }}-${{ hashFiles('PAmeasures/DESCRIPTION') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: macos-devel-source-v3-${{ hashFiles('dependency-R-version.txt') }}-${{ hashFiles('PAmeasures/DESCRIPTION') }}-
      - name: Install source dependencies with complete compiler diagnostics
        id: install-source-dependencies
        shell: bash
        run: |
          set +e
          Rscript macos-devel-dependencies.R > dependency-install-complete.log 2>&1
          status=$?
          set -e
          cat dependency-install-complete.log
          if [ "$status" -ne 0 ]; then
            python3 summarize-install-errors.py
          fi
          exit "$status"
      - name: Prepare HTML validation tool
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y tidy
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install tidy-html5
            echo "$(brew --prefix tidy-html5)/bin" >> "$GITHUB_PATH"
          elif ! command -v tidy >/dev/null; then
            choco install html-tidy -y --no-progress
          fi
      - name: Prepare PDF manual toolchain
        shell: Rscript {0}
        run: |
          root <- file.path(Sys.getenv("RUNNER_TEMP"), "TinyTeX")
          tinytex::install_tinytex(dir = root, add_path = FALSE, extra_packages = NULL)
          bins <- unique(c(file.path(root, "bin", "windows"),
                           list.dirs(file.path(root, "bin"), recursive = FALSE)))
          bins <- bins[dir.exists(bins)]
          Sys.setenv(PATH = paste(c(bins, Sys.getenv("PATH")), collapse = .Platform$path.sep))
          writeLines(bins, Sys.getenv("GITHUB_PATH"), useBytes = TRUE)
          tinytex::tlmgr_install(c("inconsolata", "helvetic", "times", "courier",
                                  "ec", "cm-super", "ae", "texinfo", "makeindex"))
          stopifnot(nzchar(Sys.which("pdflatex")), nzchar(Sys.which("makeindex")))
          writeLines("\\indexentry{PAmeasures}{1}", "index-smoke.idx")
          status <- system2(Sys.which("makeindex"), "index-smoke.idx",
                            stdout = "index-smoke.stdout", stderr = "index-smoke.stderr")
          stopifnot(status == 0L, file.exists("index-smoke.ind"))
      - name: Full CRAN-style check including PDF manual and remote checks
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          print(Sys.which(c("pdflatex", "makeindex", "pandoc", "tidy")))
          stopifnot(nzchar(Sys.which("pandoc")), nzchar(Sys.which("tidy")),
                    requireNamespace("V8", quietly = TRUE))
          result <- rcmdcheck::rcmdcheck(
            path = "PAmeasures_2.0.0.tar.gz",
            args = c("--as-cran", "--run-donttest"),
            check_dir = "check", error_on = "never", quiet = FALSE)
          summary <- list(R = R.version.string, platform = R.version$platform,
            source_sha256 = as.character(tools::sha256sum("PAmeasures_2.0.0.tar.gz")),
            errors = result$errors, warnings = result$warnings, notes = result$notes)
          jsonlite::write_json(summary, "check-summary.json", pretty = TRUE, auto_unbox = TRUE)
          public_summary <- list(R = summary$R, platform = summary$platform,
            source_sha256 = summary$source_sha256, errors = length(summary$errors),
            warnings = length(summary$warnings), notes = length(summary$notes))
          cat("::notice title=Source tarball check summary::",
              jsonlite::toJSON(public_summary, auto_unbox = TRUE), "\n", sep = "")
          for (kind in c("errors", "warnings", "notes")) {
            values <- summary[[kind]]
            for (value in values) {
              value <- gsub("%", "%25", value, fixed = TRUE)
              value <- gsub("\r", "%0D", value, fixed = TRUE)
              value <- gsub("\n", "%0A", value, fixed = TRUE)
              cat("::notice title=R CMD check ", kind, "::", value, "\n", sep = "")
            }
          }
          stopifnot(length(result$errors) == 0L, length(result$warnings) == 0L)
      - uses: actions/cache/save@v5
        if: always() && (steps.install-source-dependencies.outcome == 'success' || steps.install-source-dependencies.outcome == 'failure') && steps.dependencies-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.R_LIBS_USER }}
          key: macos-devel-source-v3-${{ hashFiles('dependency-R-version.txt') }}-${{ hashFiles('PAmeasures/DESCRIPTION') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}
          path: |
            check/**
            check-summary.json
            SHA256SUMS
            dependency-*.txt
            dependency-install-complete.log
            dependency-install-logs/**
            dependency-namespace-errors.txt
            dependency-sessionInfo.txt
            dependency-error-summary.txt
            compiler-config.txt
            flang-module-config.txt
            compiler-probe.log
            index-smoke.*
          retention-days: 14
