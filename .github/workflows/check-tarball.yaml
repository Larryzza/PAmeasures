name: PAmeasures 2.0.0 Linux release container check

on:
  push:
    branches: ['cran-check-2.0.0-*']

permissions:
  contents: read

jobs:
  check:
    name: ubuntu-24.04 (R release, container)
    runs-on: ubuntu-24.04
    container: rocker/r-ver:4.6.1
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: true
      _R_CHECK_FORCE_SUGGESTS_: true
      _R_CHECK_LIMIT_CORES_: true
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Linux build dependencies
        run: |
          apt-get update -qq
          apt-get install -y sudo git curl ca-certificates pkg-config make g++ gfortran perl unzip xz-utils libcurl4-openssl-dev libssl-dev libxml2-dev libv8-dev tidy
      - name: Configure the R installation already provided by the container
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() == "4.6.1")
          cat(R.version.string, "\n")
          profile <- file.path(Sys.getenv("RUNNER_TEMP"), "release-Rprofile")
          writeLines('options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"), Ncpus = 2L)', profile)
          cat("R_PROFILE_USER=", profile, "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Verify and extract the exact source tarball
        shell: Rscript {0}
        run: |
          expected <- strsplit(readLines("SHA256SUMS"), "  ", fixed = TRUE)[[1L]][1L]
          actual <- as.character(tools::sha256sum("PAmeasures_2.0.0.tar.gz"))
          stopifnot(identical(unname(actual), expected))
          cat("Source SHA256:", actual, "\n")
          untar("PAmeasures_2.0.0.tar.gz")
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: dependencies
        continue-on-error: true
        with:
          working-directory: PAmeasures
          extra-packages: |
            any::rcmdcheck
            any::tinytex
            any::jsonlite
            any::V8
          needs: check
      - name: Verify dependencies and retain fallback installation diagnostics
        shell: Rscript {0}
        run: |
          d <- read.dcf("PAmeasures/DESCRIPTION")
          fields <- intersect(c("Depends", "Imports", "LinkingTo", "Suggests"), colnames(d))
          dependencies <- trimws(unlist(strsplit(paste(d[1L, fields], collapse = ","), ",")))
          dependencies <- unique(sub("[[:space:]]*[(].*$", "", dependencies))
          dependencies <- setdiff(dependencies[nzchar(dependencies)], "R")
          required <- unique(c(dependencies, "rcmdcheck", "tinytex", "jsonlite", "V8"))
          available <- vapply(required, requireNamespace, logical(1), quietly = TRUE)
          writeLines(paste(required, available), "dependency-status-before.txt")
          missing <- required[!available]
          if (length(missing)) {
            cat("::notice title=Dependency setup fallback::Installing missing packages:",
                paste(missing, collapse = ", "), "\n")
            connection <- file("dependency-install.log", open = "wt")
            sink(connection, split = TRUE)
            sink(connection, type = "message")
            options(Ncpus = 2L)
            tryCatch(install.packages(missing, repos = "https://cloud.r-project.org"),
              finally = {sink(type = "message"); sink(); close(connection)})
          }
          available <- vapply(required, requireNamespace, logical(1), quietly = TRUE)
          writeLines(paste(required, available), "dependency-status-after.txt")
          if (any(!available)) {
            cat("::error title=Unavailable dependencies::",
                paste(required[!available], collapse = ", "), "\n", sep = "")
            stop("Check dependency-install.log and dependency-status files.")
          }
      - name: Prepare PDF manual toolchain
        shell: bash
        run: |
          cat > toolchain.R <<'RSCRIPT'
          root <- file.path(Sys.getenv("RUNNER_TEMP"), "TinyTeX")
          tinytex::install_tinytex(dir = root, add_path = FALSE, extra_packages = NULL)
          bins <- unique(c(file.path(root, "bin", "windows"),
                           list.dirs(file.path(root, "bin"), recursive = FALSE)))
          bins <- bins[dir.exists(bins)]
          Sys.setenv(PATH = paste(c(bins, Sys.getenv("PATH")), collapse = .Platform$path.sep))
          writeLines(bins, Sys.getenv("GITHUB_PATH"), useBytes = TRUE)
          tinytex::tlmgr_install(c("inconsolata", "helvetic", "times", "courier",
                                  "ec", "cm-super", "ae", "texinfo", "makeindex"))
          stopifnot(nzchar(Sys.which("pdflatex")), nzchar(Sys.which("makeindex")))
          writeLines("\\indexentry{PAmeasures}{1}", "index-smoke.idx")
          status <- system2(Sys.which("makeindex"), "index-smoke.idx",
                            stdout = "index-smoke.stdout", stderr = "index-smoke.stderr")
          stopifnot(status == 0L, file.exists("index-smoke.ind"))
          RSCRIPT
          set +e
          Rscript toolchain.R > toolchain-install.log 2>&1
          status=$?
          set -e
          cat toolchain-install.log
          if [ "$status" -ne 0 ]; then
            Rscript -e 's <- readLines("toolchain-install.log", warn = FALSE); s <- s[grepl("error|fail|cannot|not found|not installed|locate", s, ignore.case = TRUE)]; s <- paste(tail(s, 12L), collapse = " | "); s <- gsub("%", "%25", s, fixed = TRUE); cat("::error title=PDF toolchain setup::", s, "\n", sep = "")'
          fi
          exit "$status"
      - name: Full CRAN-style check including PDF manual and remote checks
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          stopifnot(getRversion() == "4.6.1")
          print(Sys.which(c("pdflatex", "makeindex", "pandoc", "tidy")))
          stopifnot(nzchar(Sys.which("pandoc")), nzchar(Sys.which("tidy")),
                    requireNamespace("V8", quietly = TRUE))
          result <- rcmdcheck::rcmdcheck(
            path = "PAmeasures_2.0.0.tar.gz",
            args = c("--as-cran", "--run-donttest"),
            check_dir = "check", error_on = "never", quiet = FALSE)
          summary <- list(R = R.version.string, platform = R.version$platform,
            source_sha256 = as.character(tools::sha256sum("PAmeasures_2.0.0.tar.gz")),
            errors = result$errors, warnings = result$warnings, notes = result$notes)
          jsonlite::write_json(summary, "check-summary.json", pretty = TRUE, auto_unbox = TRUE)
          for (kind in c("errors", "warnings", "notes")) {
            values <- summary[[kind]]
            for (value in values) {
              value <- gsub("%", "%25", value, fixed = TRUE)
              value <- gsub("\r", "%0D", value, fixed = TRUE)
              value <- gsub("\n", "%0A", value, fixed = TRUE)
              cat("::notice title=R CMD check ", kind, "::", value, "\n", sep = "")
            }
          }
          stopifnot(length(result$errors) == 0L, length(result$warnings) == 0L)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: check-ubuntu-release-container
          path: |
            check/**
            check-summary.json
            SHA256SUMS
            dependency-*.txt
            dependency-install.log
            index-smoke.*
            toolchain-install.log
            toolchain.R
          retention-days: 14
